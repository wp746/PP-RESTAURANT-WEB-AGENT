name: PP Agent CI
on:
  push:
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and tests
        run: python -m pip install -e '.[qa,files]'
      - name: Python syntax
        run: python -m compileall -q ppweb
      - name: Unit tests
        run: python -m pytest -q
