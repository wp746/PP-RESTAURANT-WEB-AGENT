name: Publish approved static snapshot (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to publish full sites snapshot'
        required: true
        type: string
concurrency:
  group: pp-pages-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Protect existing snapshot
        shell: bash
        run: |
          test -s sites/index.html || (echo 'Missing full site snapshot' >&2; exit 1)
          test -s sites/wangjiao/index.html || (echo 'Existing flagship site missing' >&2; exit 1)
          if find sites -type f \( -name '*.env' -o -name '*token*' -o -name '*.pem' \) | grep -q .; then
            echo 'Potential secret accidentally included in sites' >&2; exit 1
          fi
      - name: Publish entire approved snapshot to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy sites --project-name pp-restaurants --branch main
      - name: Echo stable URL
        run: echo 'https://pp-restaurants.pages.dev/'
